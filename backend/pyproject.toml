[project]
name = "email-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for fine-tuned Mistral-7B email classification and tone matching"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "vllm>=0.6.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "scikit-learn>=1.5.0",
    "psycopg2-binary>=2.9.0",
    "google-generativeai>=0.8.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "google-api-python-client>=2.140.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "trl>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
