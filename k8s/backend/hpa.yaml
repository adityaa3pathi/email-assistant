apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: email-assistant-backend-hpa
  namespace: email-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: email-assistant-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
