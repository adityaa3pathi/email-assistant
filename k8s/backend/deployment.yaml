apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-assistant-backend
  namespace: email-assistant
  labels:
    app: email-assistant
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-assistant
      component: backend
  template:
    metadata:
      labels:
        app: email-assistant
        component: backend
    spec:
      containers:
        - name: backend
          image: email-assistant-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: email-assistant-config
            - secretRef:
                name: email-assistant-secrets
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 8Gi
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
