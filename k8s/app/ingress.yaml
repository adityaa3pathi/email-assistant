apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-assistant-ingress
  namespace: email-assistant
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: email-assistant-ip
spec:
  rules:
    - host: email-assistant.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: email-assistant-app
                port:
                  number: 80
