apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-assistant-app
  namespace: email-assistant
  labels:
    app: email-assistant
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-assistant
      component: frontend
  template:
    metadata:
      labels:
        app: email-assistant
        component: frontend
    spec:
      containers:
        - name: app
          image: email-assistant-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: email-assistant-config
            - secretRef:
                name: email-assistant-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
